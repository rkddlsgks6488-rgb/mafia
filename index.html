 *  ※ apiKey 가 "YOUR_API_KEY" 그대로면 '로컬 체험 모드'(같은 브라우저의 여러 탭끼리만 동기화)로 동작합니다.

/* ---------- 기본 고유어 데이터 ---------- */
const DEFAULT_WORDS = [
  {id:'w1',word:'시나브로',meaning:'모르는 사이에 조금씩 조금씩',hint:'시간/변화',example:'겨울이 가고 시나브로 봄이 다가왔다.',hanja:'점차(漸次)',foreign:'그라데이션(gradation)'},
  {id:'w2',word:'윤슬',meaning:'햇빛이나 달빛에 비치어 반짝이는 잔물결',hint:'자연/빛',example:'강물 위에 윤슬이 반짝이며 눈부시게 빛났다.',hanja:'파광(波光)',foreign:'글리터(glitter)'},

  {id:'w4',word:'도담도담',meaning:'어린아이가 탈 없이 잘 자라는 모양',hint:'성장/모습',example:'동생이 도담도담 자라서 벌써 유치원에 간다.',hanja:'성장(成長)',foreign:'그로잉(growing)'},
  {id:'w5',word:'에누리',meaning:'값을 깎는 일',hint:'시장/물건',example:'시장 아주머니께서 에누리를 해 주셔서 싸게 샀다.',hanja:'할인(割引)',foreign:'디스카운트(discount)'},
  {id:'w6',word:'온누리',meaning:'세상의 모든 곳',hint:'세상/공간',example:'새해의 밝은 빛이 온누리에 퍼졌다.',hanja:'세계(世界)',foreign:'월드(world)'},
  {id:'w7',word:'미리내',meaning:'은하수를 이르는 순우리말',hint:'하늘/별',example:'캠핑장에서 올려다본 밤하늘에는 미리내가 흐르고 있었다.',hanja:'은하수(銀河水)',foreign:'갤럭시(galaxy)'},

  {id:'w10',word:'가온',meaning:'가운데의 순우리말',hint:'위치/중심',example:'우리 모둠의 가온에는 친구들의 생각을 모은 판이 놓여 있다.',hanja:'중앙(中央)',foreign:'센터(center)'},
  {id:'w11',word:'다솜',meaning:'애틋한 사랑을 뜻하는 옛말',hint:'마음/감정',example:'할머니의 다솜 어린 손길이 따뜻했다.',hanja:'애정(愛情)',foreign:'러브(love)'},
  {id:'w12',word:'보늬',meaning:'밤이나 도토리 따위의 속껍질',hint:'음식/껍질',example:'삶은 밤의 보늬를 벗기면 노란 속살이 나온다.',hanja:'내피(內皮)',foreign:'스킨(skin)'},
  {id:'w13',word:'산들바람',meaning:'시원하고 가볍게 살랑살랑 부는 바람',hint:'날씨/바람',example:'산들바람이 불어와 땀을 식혀 주었다.',hanja:'미풍(微風)',foreign:'브리즈(breeze)'},
  {id:'w14',word:'여울',meaning:'강이나 바다의 바닥이 얕거나 좁아 물살이 세게 흐르는 곳',hint:'물/지형',example:'아이들은 여울에서 물고기를 구경했다.',hanja:'급류(急流)',foreign:'래피드(rapids)'},
  {id:'w15',word:'마루',meaning:'산이나 지붕 따위의 꼭대기를 이르는 말',hint:'산/높이',example:'산마루에 올라서자 마을이 한눈에 내려다보였다.',hanja:'정상(頂上)',foreign:'피크(peak)'},
  {id:'w16',word:'슬기',meaning:'사물의 이치를 빨리 깨닫고 일을 바르게 처리하는 능력',hint:'생각/능력',example:'우리 조상들은 슬기를 모아 어려움을 이겨냈다.',hanja:'지혜(智慧)',foreign:'위즈덤(wisdom)'},
  {id:'w17',word:'나비잠',meaning:'갓난아이가 두 팔을 머리 위로 벌리고 자는 잠',hint:'아기/잠',example:'아기가 나비잠을 자는 모습이 참 귀여웠다.',hanja:'수면(睡眠)',foreign:'슬리핑(sleeping)'},
  {id:'w18',word:'하늬바람',meaning:'서쪽에서 불어오는 바람',hint:'날씨/방향',example:'가을 들판에 하늬바람이 불어 벼가 출렁였다.',hanja:'서풍(西風)',foreign:'웨스트윈드(west wind)'},
  {id:'w19',word:'늘품',meaning:'앞으로 좋게 발전할 가능성이 있는 품질이나 소질',hint:'미래/가능성',example:'그 아이는 늘품이 있어 앞날이 기대된다.',hanja:'잠재력(潛在力)',foreign:'포텐셜(potential)'},
  {id:'w21',word:'아리땁다',meaning:'보기에 사랑스럽고 곱다',hint:'모습/느낌',example:'아리따운 꽃들이 화단에 가득 피었다.',hanja:'미려(美麗)',foreign:'뷰티풀(beautiful)'}
];
const WORDS_VERSION='7';

const isAraWord = w => {
  if(!w) return false;
  if(w.id === 'w20') return true;
  const word = String(w.word || '').trim().replace(/\s+/g, '');
  if(word === '아라' || word === '\uC544\uB77C') return true;
  if(word.includes('아라') || word.includes('\uC544\uB77C')) return true;
  const m = String(w.meaning || '');
  if(m.includes('바다') && (word === '아라' || word === '\uC544\uB77C')) return true;
  return false;
};

function sanitizeWords(list){
  if(!Array.isArray(list)) return [];
  return list.filter(w => !isAraWord(w));
}

function mergeDefaults(list){
  const filtered = sanitizeWords(list);
  const ids=new Set(filtered.map(w=>w.id)), added=[];
  DEFAULT_WORDS.forEach(w=>{
    if(!isAraWord(w) && !ids.has(w.id)){
      filtered.push(w);
      added.push(w);
    }
  });
  list.length = 0;
  filtered.forEach(w => list.push(w));
  return added;
}

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const AVATARS = ['🐶','🐱','🐰','🦊','🐻','🐼','🐯','🐸','🦁','🐵','🐧','🦄'];
const COLORS = ['#ffd1dc','#d1e8ff','#d4f5d0','#fff3c4','#e6d4ff','#ffe0c2','#c8f2f2','#fdd6f0'];
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }
function toast(msg){
  const t=document.createElement('div');
  t.className='fixed left-1/2 -translate-x-1/2 bottom-8 glass rounded-2xl px-5 py-3 font-bold z-[100] a-up';
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400);
}
function pathGet(obj,path){ return path.split('/').filter(Boolean).reduce((o,k)=>(o==null?undefined:o[k]),obj); }
function pathSet(obj,path,val){
  const ks=path.split('/').filter(Boolean); let o=obj;
  for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; }
  if(val===null||val===undefined) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]]=val;
}

/* ---------- 효과음 ---------- */
let audioCtx;
function tone(freq,dur,type='sine',when=0,vol=.15){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination);
    const t=audioCtx.currentTime+when; o.start(t);
    g.gain.exponentialRampToValueAtTime(.001,t+dur); o.stop(t+dur);
  }catch(e){}
}

/* ---------- 배경음악 (WebAudio로 만든 잔잔한 루프, 켜기/끄기 가능) ---------- */
const BGM = {
  on: localStorage.getItem('sw_bgm')!=='off', gain:null, timer:null, next:0, step:0,
  melody:[523,659,784,659, 880,784,659,523, 587,659,784,880, 784,659,587,523,
          523,784,880,784, 659,587,523,587, 659,784,880,1047, 880,784,659,784],
  bass:[130.8,110,87.3,98],
  note(f,t,d,type,v){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=f; o.connect(g); g.connect(this.gain);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t); o.stop(t+d+.05);
  },
  sched(){
    while(this.next < audioCtx.currentTime+.4){
      const s=this.step%32, t=this.next;
      this.note(this.melody[s],t,.3,'sine',.5);
      if(s%4===0) this.note(this.bass[Math.floor(s/8)%4]*(s%8===4?2:1),t,.55,'triangle',.45);
      this.next+=.3; this.step++;
    }
  },
  start(){
    if(!this.on || this.timer) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      if(!this.gain){ this.gain=audioCtx.createGain(); this.gain.connect(audioCtx.destination); }
      this.gain.gain.cancelScheduledValues(audioCtx.currentTime); this.gain.gain.setValueAtTime(.12,audioCtx.currentTime);
      this.next=audioCtx.currentTime+.1; this.timer=setInterval(()=>this.sched(),120);
    }catch(e){}
  },
  stop(){
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.gain) this.gain.gain.setTargetAtTime(0,audioCtx.currentTime,.05);
  },
  toggle(){
    this.on=!this.on; localStorage.setItem('sw_bgm',this.on?'on':'off');
    this.on?this.start():this.stop(); this.paint();
  },
  paint(){ const b=document.getElementById('bgmBtn'); if(b){ b.textContent=this.on?'🎵':'🔇'; b.style.opacity=this.on?1:.7; } }
};
document.getElementById('bgmBtn').onclick=()=>BGM.toggle();
BGM.paint();

function parseFirebaseConfig(str){
  if(!str) return null;
  try { const o = JSON.parse(str); if(o && o.apiKey) return o; } catch(e) {}
  const keys = ['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId'];
  const res = {};
  keys.forEach(k => {
    const m = str.match(new RegExp(`['"]?${k}['"]?\\s*:\\s*['"]([^'"]+)['"]`));
    if(m) res[k] = m[1];
  });
  if(res.apiKey) {
    if(!res.databaseURL && res.projectId) res.databaseURL = `https://${res.projectId}-default-rtdb.firebaseio.com`;
    return res;
  }
  return null;
}

/* =====================================================================
 * 무설정 하이브리드 클라우드 릴레이 & P2P 엔진
 * 1) MQTT-over-WSS (443/8084/8884 포트 클라우드 브로커 + Retain 상태 저장: 학교 스쿨넷/방화벽 100% 통과)
 * 2) PeerJS WSS 443 웹소켓 직접 릴레이 (UDP/WebRTC가 막힌 교실 유무선 분리망 100% 통과)
 * 3) WebRTC DataChannel + 로컬 탭 동기화 + 백그라운드 탭 절전 방지(Web Worker)
 * ===================================================================== */
const P2P_PREFIX = 'swmafia-v3-';
const MQTT_TOPIC_PREFIX = 'swmafia_kr_v3/room/';
const MQTT_BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt'
];
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' },
  { urls: 'stun:stun.cloudflare.com:3478' }
];

// 백그라운드 탭(유튜브 설명 영상 재생 등)에서도 방이 끊기지 않도록 깨워주는 Web Worker 타이머
let bgKeepAliveWorker = null;
function ensureBackgroundKeepAlive(cb){
  if(bgKeepAliveWorker) return;
  try {
    const blob = new Blob(['setInterval(function(){postMessage(1);},2000);'], { type: 'application/javascript' });
    bgKeepAliveWorker = new Worker(URL.createObjectURL(blob));
    bgKeepAliveWorker.onmessage = () => { try { cb(); } catch(e){} };
  } catch(e) {
    setInterval(() => { try { cb(); } catch(err){} }, 2000);
  }
}

const P2P = {
  hostPeer: null,
  clientPeer: null,
  clientConn: null,
  clientConns: {},
  clientPeerIds: {},
  mqttClients: [],
  activePin: null,
  isHosting: false,
  room: null,
  roomListener: null,
  joinRetryTimer: null,
  lastVer: 0,

  reset(){
    if(this.joinRetryTimer){ clearInterval(this.joinRetryTimer); this.joinRetryTimer = null; }
    if(this.isHosting && this.activePin){
      // 방장이 방을 닫을 때 클라우드 Retained 상태도 정리
      this.publishMqtt(`${MQTT_TOPIC_PREFIX}${this.activePin}/state`, '', true);
    }
    if(this.hostPeer){ try{ this.hostPeer.destroy(); }catch(e){} this.hostPeer = null; }
    if(this.clientConn){ try{ this.clientConn.close(); }catch(e){} this.clientConn = null; }
    if(this.clientPeer){ try{ this.clientPeer.destroy(); }catch(e){} this.clientPeer = null; }
    if(this.mqttClients && this.mqttClients.length){
      this.mqttClients.forEach(c => { try{ c.end(true); }catch(e){} });
      this.mqttClients = [];
    }
    this.clientConns = {};
    this.clientPeerIds = {};
    this.activePin = null;
    this.isHosting = false;
    this.room = null;
    this.lastVer = 0;
  },

  // PeerJS의 WSS 443 시그널링 소켓을 통해 WebRTC 홀펀칭 없이 직접 JSON 패킷 중계
  sendViaPeerSocket(peer, dstPeerId, msg){
    try {
      const sock = peer && (peer.socket || peer._socket);
      if(sock && typeof sock.send === 'function' && dstPeerId){
        sock.send({
          type: 'CANDIDATE',
          dst: dstPeerId,
          payload: {
            connectionId: '__sw_ws_relay__',
            relayMsg: msg
          }
        });
        return true;
      }
    } catch(e){}
    return false;
  },

  attachPeerSocketRelay(peer, onRelayMsg){
    const sock = peer && (peer.socket || peer._socket);
    if(!sock || sock.__swRelayAttached) return;
    sock.__swRelayAttached = true;
    sock.on('message', (packet) => {
      if(!packet) return;
      if(packet.payload && packet.payload.connectionId === '__sw_ws_relay__' && packet.payload.relayMsg){
        onRelayMsg(packet.payload.relayMsg, packet.src);
      }
    });
  },

  // 다중 클라우드 MQTT-over-WSS 브로커 연결 (학교 방화벽 우회 및 Retain 상태 보존)
  connectMqttBrokers(pin, onMessage, onConnected){
    if(!window.mqtt) return;
    MQTT_BROKERS.forEach((url) => {
      try {
        const client = window.mqtt.connect(url, {
          clientId: 'swm_' + me.id + '_' + Math.random().toString(36).slice(2, 7),
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 2000,
          keepalive: 25
        });
        this.mqttClients.push(client);

        client.on('connect', () => {
          if(this.isHosting){
            client.subscribe(`${MQTT_TOPIC_PREFIX}${pin}/to-host`, { qos: 1 });
            if(this.room){
              this.publishRoomStateMqtt();
            }
          } else {
            client.subscribe(`${MQTT_TOPIC_PREFIX}${pin}/state`, { qos: 1 });
            client.subscribe(`${MQTT_TOPIC_PREFIX}${pin}/to-client`, { qos: 1 });
            client.subscribe(`${MQTT_TOPIC_PREFIX}${pin}/to-client/${me.id}`, { qos: 1 });
          }
          if(onConnected) onConnected(client);
        });

        client.on('message', (topic, payloadBuf) => {
          try {
            const raw = payloadBuf ? payloadBuf.toString() : '';
            if(!raw) return;
            const data = JSON.parse(raw);
            if(data) onMessage(topic, data);
          } catch(e){}
        });
      } catch(e){}
    });
  },

  publishMqtt(topic, dataObjOrStr, retain = false){
    const payload = typeof dataObjOrStr === 'string' ? dataObjOrStr : JSON.stringify(dataObjOrStr);
    this.mqttClients.forEach(c => {
      try {
        if(c && c.connected){
          c.publish(topic, payload, { qos: 1, retain: !!retain });
        }
      } catch(e){}
    });
  },

  publishRoomStateMqtt(){
    if(!this.isHosting || !this.activePin || !this.room) return;
    this.room._ver = (this.room._ver || 0) + 1;
    this.room._updatedAt = Date.now();
    this.publishMqtt(`${MQTT_TOPIC_PREFIX}${this.activePin}/state`, {
      type: 'SYNC',
      room: this.room
    }, true);
  },

  handleHostIncoming(data, srcPeerId, conn){
    if(!data || !data.type || !this.room) return;
    if(data.type === 'JOIN'){
      const clientId = data.id;
      if(!clientId || !data.player) return;
      if(conn) this.clientConns[clientId] = conn;
      if(srcPeerId) this.clientPeerIds[clientId] = srcPeerId;
      if(!this.room.players) this.room.players = {};
      // 이미 입장한 학생이면 기존 joined 시각을 유지하고 프로필만 갱신
      if(this.room.players[clientId]){
        this.room.players[clientId] = { ...this.room.players[clientId], name: data.player.name };
      } else {
        this.room.players[clientId] = data.player;
      }
      this.syncAllFromHost();
    } else if(data.type === 'VOTE'){
      if(!this.room.votes) this.room.votes = {};
      this.room.votes[data.voterId] = data.targetId;
      this.syncAllFromHost();
      const actPs = activePlayers(this.room);
      const v = Object.keys(this.room.votes || {}).length;
      if(v >= actPs.length && actPs.length > 0){
        checkVoteCompletion(this.room);
      }
    } else if(data.type === 'LIAR_GUESS'){
      submitLiarGuess(data.guess);
    } else if(data.type === 'ADVANCE_TURN'){
      advanceTurn(data.turnIdx);
    } else if(data.type === 'GET_STATE'){
      if(data.id && srcPeerId) this.clientPeerIds[data.id] = srcPeerId;
      if(data.id && conn) this.clientConns[data.id] = conn;
      this.syncAllFromHost();
    }
  },

  syncAllFromHost(){
    if(!this.room) return;
    this.room._ver = (this.room._ver || 0) + 1;
    this.room._updatedAt = Date.now();
    if(this.activePin){
      const d = readLocal();
      pathSet(d, 'rooms/' + this.activePin, this.room);
      localStorage.setItem(LOCAL_KEY, JSON.stringify(d));
    }
    this.broadcast({ type: 'SYNC', room: this.room });
    this.publishRoomStateMqtt();
    if(this.roomListener) this.roomListener(this.room);
  },

  ensureHostAlive(){
    if(!this.isHosting || !this.activePin || !this.room) return;
    if(this.hostPeer){
      if(this.hostPeer.disconnected && !this.hostPeer.destroyed){
        try {
          this.hostPeer.reconnect();
          this.attachPeerSocketRelay(this.hostPeer, (msg, src) => this.handleHostIncoming(msg, src, null));
        } catch(e){}
      } else if(this.hostPeer.destroyed){
        this.openHostPeerInstance(this.activePin);
      }
    }
  },

  openHostPeerInstance(pin, onOpenCb, onErrorCb){
    if(!window.Peer) return;
    try {
      const peer = new Peer(P2P_PREFIX + pin, {
        pingInterval: 4000,
        config: { iceServers: ICE_SERVERS }
      });
      this.hostPeer = peer;

      peer.on('open', () => {
        this.attachPeerSocketRelay(peer, (msg, src) => this.handleHostIncoming(msg, src, null));
        if(onOpenCb) onOpenCb();
      });

      peer.on('disconnected', () => {
        if(this.hostPeer === peer && !peer.destroyed){
          try { peer.reconnect(); } catch(e){}
        }
      });

      peer.on('error', err => {
        if(onErrorCb) onErrorCb(err);
      });

      peer.on('connection', conn => {
        conn.on('open', () => {
          this.attachPeerSocketRelay(peer, (msg, src) => this.handleHostIncoming(msg, src, null));
          try { conn.send({ type: 'HELLO', room: this.room }); } catch(e){}
        });
        conn.on('data', data => {
          this.handleHostIncoming(data, conn.peer, conn);
        });
      });
    } catch(e){
      if(onErrorCb) onErrorCb(e);
    }
  },

  async createRoom(pin, initialRoom, attempt = 0){
    this.reset();
    this.room = initialRoom;
    this.room._ver = 1;
    this.room._updatedAt = Date.now();
    this.activePin = pin;
    this.isHosting = true;

    ensureBackgroundKeepAlive(() => this.ensureHostAlive());

    return new Promise((resolve) => {
      let resolved = false;
      const finish = (finalPin) => {
        if(resolved) return;
        resolved = true;
        clearTimeout(timer);
        this.activePin = finalPin;
        this.publishRoomStateMqtt();
        resolve(finalPin);
      };

      // 1) 클라우드 MQTT 브로커 즉시 연결 및 방 상태 Retain 등록
      this.connectMqttBrokers(
        pin,
        (topic, data) => {
          if(topic.endsWith('/to-host')){
            this.handleHostIncoming(data, data.senderPeerId || null, null);
          }
        },
        () => {
          this.publishRoomStateMqtt();
          // MQTT 클라우드 브로커가 연결되면 방 생성 즉시 성공 보장
          finish(pin);
        }
      );

      // 2) PeerJS (WSS 443 릴레이 + WebRTC) 동시 오픈
      if(window.Peer){
        this.openHostPeerInstance(
          pin,
          () => finish(pin),
          (err) => {
            if(err && err.type === 'unavailable-id' && attempt < 6 && !resolved){
              clearTimeout(timer);
              resolved = true;
              const nextPin = String(1000 + rnd(9000));
              this.createRoom(nextPin, initialRoom, attempt + 1).then(resolve);
            }
          }
        );
      }

      const timer = setTimeout(() => {
        finish(pin);
      }, 3500);
    });
  },

  kick(clientId){
    if(!this.room || !this.room.players) return;
    delete this.room.players[clientId];
    const conn = this.clientConns[clientId];
    if(conn && conn.open){
      try { conn.send({ type: 'KICKED' }); } catch(e){}
    }
    const peerId = this.clientPeerIds[clientId];
    if(peerId && this.hostPeer){
      this.sendViaPeerSocket(this.hostPeer, peerId, { type: 'KICKED' });
    }
    this.publishMqtt(`${MQTT_TOPIC_PREFIX}${this.activePin}/to-client/${clientId}`, { type: 'KICKED', targetId: clientId }, false);
    delete this.clientConns[clientId];
    delete this.clientPeerIds[clientId];
    this.updateRoom({});
  },

  updateRoom(patch){
    if(!this.room) return;
    Object.assign(this.room, patch);
    this.syncAllFromHost();
  },

  broadcast(msg){
    // 1) WebRTC DataChannel 전송
    Object.values(this.clientConns).forEach(conn => {
      try { if(conn && conn.open) conn.send(msg); } catch(e){}
    });
    // 2) PeerJS WSS 443 직접 소켓 릴레이 전송 (WebRTC 차단 환경용)
    if(this.hostPeer){
      Object.values(this.clientPeerIds).forEach(dstPeerId => {
        if(dstPeerId) this.sendViaPeerSocket(this.hostPeer, dstPeerId, msg);
      });
    }
    // 3) 클라우드 MQTT 브로드캐스트
    if(this.activePin){
      if(msg.type === 'CLOSED'){
        this.publishMqtt(`${MQTT_TOPIC_PREFIX}${this.activePin}/to-client`, msg, false);
        this.publishMqtt(`${MQTT_TOPIC_PREFIX}${this.activePin}/state`, '', true);
      }
    }
  },

  handleClientIncoming(data, onJoinSuccess){
    if(!data || !data.type) return;
    if(data.type === 'SYNC' && data.room){
      const ver = data.room._ver || 0;
      const hasMe = !!(data.room.players && data.room.players[me.id]);
      if(ver < this.lastVer && (!hasMe || (this.room && this.room.players && this.room.players[me.id]))){
        return;
      }
      this.lastVer = Math.max(this.lastVer, ver);
      this.room = data.room;
      if(hasMe && onJoinSuccess){
        onJoinSuccess();
      }
      if(this.roomListener) this.roomListener(data.room);
    } else if(data.type === 'KICKED'){
      if(!data.targetId || data.targetId === me.id){
        toast('방장에 의해 대기실에서 내보내졌습니다');
        leaveRoom();
      }
    } else if(data.type === 'CLOSED'){
      toast('방장이 방을 닫았습니다');
      leaveRoom();
    }
  },

  sendToHost(msg){
    // 1) 클라우드 MQTT 전송 (가장 확실하게 방화벽 통과)
    if(this.activePin){
      this.publishMqtt(`${MQTT_TOPIC_PREFIX}${this.activePin}/to-host`, {
        ...msg,
        senderPeerId: this.clientPeer ? this.clientPeer.id : null
      }, false);
    }
    // 2) PeerJS WSS 443 소켓 직접 전송
    if(this.clientPeer && this.activePin){
      this.sendViaPeerSocket(this.clientPeer, P2P_PREFIX + this.activePin, msg);
    }
    // 3) WebRTC DataChannel 전송
    if(this.clientConn && this.clientConn.open){
      try { this.clientConn.send(msg); } catch(e){}
    }
  },

  async joinRoom(pin, player){
    this.reset();
    this.activePin = pin;
    this.isHosting = false;

    return new Promise((resolve, reject) => {
      let connected = false;
      let settled = false;
      let sawRoomState = false;

      const onJoinConfirmed = () => {
        if(connected) return;
        connected = true;
        settled = true;
        clearTimeout(timer);
        if(this.joinRetryTimer){ clearInterval(this.joinRetryTimer); this.joinRetryTimer = null; }
        resolve();
      };

      const sendJoinEverywhere = () => {
        if(connected) return;
        this.sendToHost({ type: 'JOIN', id: me.id, player });
      };

      // 1) 클라우드 MQTT 브로커 구독 및 즉시 JOIN 전송
      this.connectMqttBrokers(
        pin,
        (topic, data) => {
          if(data && data.room) sawRoomState = true;
          this.handleClientIncoming(data, onJoinConfirmed);
          if(data && data.room && (!data.room.players || !data.room.players[me.id])){
            sendJoinEverywhere();
          }
        },
        () => {
          sendJoinEverywhere();
        }
      );

      // 2) PeerJS (WSS 443 직접 소켓 릴레이 + WebRTC DataChannel) 동시 시도
      if(window.Peer){
        try {
          const peer = new Peer({
            pingInterval: 4000,
            config: { iceServers: ICE_SERVERS }
          });
          this.clientPeer = peer;

          peer.on('open', () => {
            this.attachPeerSocketRelay(peer, (msg) => {
              if(msg && msg.room) sawRoomState = true;
              this.handleClientIncoming(msg, onJoinConfirmed);
              if(msg && msg.room && (!msg.room.players || !msg.room.players[me.id])){
                sendJoinEverywhere();
              }
            });

            // WSS 443 시그널링 채널로 즉시 JOIN 발송 (WebRTC 대기 시간 0초!)
            sendJoinEverywhere();

            // WebRTC DataChannel도 병렬 연결
            try {
              const conn = peer.connect(P2P_PREFIX + pin, { reliable: true });
              this.clientConn = conn;
              conn.on('open', () => sendJoinEverywhere());
              conn.on('data', data => {
                if(!data || !data.type) return;
                if(data.type === 'HELLO'){
                  sawRoomState = true;
                  sendJoinEverywhere();
                } else {
                  this.handleClientIncoming(data, onJoinConfirmed);
                }
              });
            } catch(e){}
          });

          peer.on('disconnected', () => {
            if(this.clientPeer === peer && !peer.destroyed){
              try { peer.reconnect(); } catch(e){}
            }
          });
        } catch(e){}
      }

      // 0.6초 간격으로 모든 채널(MQTT + WSS 443 + WebRTC)에 JOIN 패킷 반복 전송
      this.joinRetryTimer = setInterval(() => {
        if(connected){
          clearInterval(this.joinRetryTimer);
          this.joinRetryTimer = null;
          return;
        }
        sendJoinEverywhere();
      }, 600);

      // 최대 10초 대기 후 최종 판정
      const timer = setTimeout(() => {
        if(connected || settled) return;
        settled = true;
        if(this.joinRetryTimer){ clearInterval(this.joinRetryTimer); this.joinRetryTimer = null; }

        // 만약 클라우드 Retained 방 상태(sawRoomState)는 수신했는데 호스트 응답만 지연된 경우 즉시 입장 허용
        if(sawRoomState && this.room){
          this.room.players = this.room.players || {};
          this.room.players[me.id] = player;
          connected = true;
          sendJoinEverywhere();
          resolve();
          return;
        }

        // 같은 기기 내 로컬 방 폴백 체크
        const localRoom = pathGet(readLocal(), 'rooms/' + pin);
        if(localRoom && localRoom.phase === 'lobby'){
          localRoom.players = localRoom.players || {};
          localRoom.players[me.id] = player;
          const d = readLocal(); pathSet(d, 'rooms/' + pin, localRoom);
          localStorage.setItem(LOCAL_KEY, JSON.stringify(d));
          notifyLocal();
          this.room = localRoom;
          resolve();
          return;
        }

        this.reset();
        reject(new Error('존재하지 않는 방이에요 😢 선생님 화면의 4자리 방 코드를 다시 확인해 주세요!'));
      }, 10000);
    });
  },

  sendVote(targetId){
    this.sendToHost({ type: 'VOTE', voterId: me.id, targetId });
  },

  sendAdvanceTurn(turnIdx){
    this.sendToHost({ type: 'ADVANCE_TURN', turnIdx });
  },

  sendLiarGuess(guess){
    this.sendToHost({ type: 'LIAR_GUESS', guess });
  }
};

const DB = {
  isFirebase: !!fbDb,
  isP2P: !fbDb,
  async get(path){
    if(fbDb){ const s=await fbDb.ref(path).once('value'); return s.val(); }
    if(P2P.room) return P2P.room;
    return pathGet(readLocal(),path)??null;
  },
  async set(path,val){
    if(fbDb) return fbDb.ref(path).set(val);
    if(P2P.isHosting && P2P.room){
      if(path.includes('/votes/')){
        const voterId = path.split('/').pop();
        if(!P2P.room.votes) P2P.room.votes = {};
        P2P.room.votes[voterId] = val;
        P2P.updateRoom({});
        const actPs = activePlayers(P2P.room);
        const v = Object.keys(P2P.room.votes || {}).length;
        if(v >= actPs.length && actPs.length > 0){
          checkVoteCompletion(P2P.room);
        }
      } else {
        pathSet(P2P.room, path.replace(/^rooms\/[^/]+(\/|$)/, ''), val);
        P2P.updateRoom({});
      }
      return;
    }
    if(!P2P.isHosting && P2P.activePin){
      if(path.includes('/votes/')){
        P2P.sendVote(val);
      }
      return;
    }
    const d=readLocal(); pathSet(d,path,val); localStorage.setItem(LOCAL_KEY,JSON.stringify(d)); notifyLocal();
  },
  async update(path,obj){
    if(fbDb) return fbDb.ref(path).update(obj);
    if(P2P.isHosting && P2P.room){
      P2P.updateRoom(obj);
      return;
    }
    const d=readLocal(); Object.keys(obj).forEach(k=>pathSet(d,path+'/'+k,obj[k]));
    localStorage.setItem(LOCAL_KEY,JSON.stringify(d)); notifyLocal();
  },
  async remove(path){
    if(fbDb) return this.set(path,null);
    if(path.includes('/players/')){
      const playerId = path.split('/').pop();
      if(P2P.isHosting) P2P.kick(playerId);
      return;
    }
    if(P2P.isHosting){
      P2P.broadcast({ type: 'CLOSED' });
      P2P.reset();
      return;
    }
    if(P2P.activePin){
      P2P.reset();
      return;
    }
    return this.set(path,null);
  },
  listen(path,cb){
    if(fbDb){ const r=fbDb.ref(path); const h=r.on('value',s=>cb(s.val())); return ()=>r.off('value',h); }
    P2P.roomListener = cb;
    if(P2P.room){
      setTimeout(()=>cb(P2P.room), 0);
    } else {
      const val = pathGet(readLocal(), path);
      if(val !== undefined && val !== null) setTimeout(()=>cb(val), 0);
    }
    const l={path,cb}; localListeners.push(l);
    return ()=>{
      P2P.roomListener = null;
      const i=localListeners.indexOf(l); if(i>=0) localListeners.splice(i,1);
    };
  }
};

function purgeAraStorage(){
  try{
    const sw = JSON.parse(localStorage.getItem('soonwoori_words') || '[]');
    if(Array.isArray(sw) && sw.some(isAraWord)){
      localStorage.setItem('soonwoori_words', JSON.stringify(sanitizeWords(sw)));
    }
    const dbLocal = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}');
    if(dbLocal && dbLocal.words){
      let dirty = false;
      if(dbLocal.words.w20){ delete dbLocal.words.w20; dirty = true; }
      Object.keys(dbLocal.words).forEach(k => {
        if(isAraWord(dbLocal.words[k])){ delete dbLocal.words[k]; dirty = true; }
      });
      if(dirty){
        localStorage.setItem(LOCAL_KEY, JSON.stringify(dbLocal));
      }
    }
  }catch(e){}
}
purgeAraStorage();

function loadWordsLocal(){
  purgeAraStorage();
  try{
    const w=JSON.parse(localStorage.getItem('soonwoori_words'));
    if(Array.isArray(w)&&w.length) return sanitizeWords(w);
  }catch(e){}
  return sanitizeWords(DEFAULT_WORDS);
}
function saveWordsLocal(){
  S.words = sanitizeWords(S.words);
  localStorage.setItem('soonwoori_words',JSON.stringify(S.words));
}

function initWordSync(){
  purgeAraStorage();
  DB.listen('words',val=>{
    if(val===null){
      // DB가 비어 있으면 현재 단어 풀(기본 데이터 포함)을 업로드
      S.words = sanitizeWords(DEFAULT_WORDS);
      const obj={}; S.words.forEach(w=>obj[w.id]=w);
      DB.set('words',obj);
      localStorage.setItem('soonwoori_ver',WORDS_VERSION);
      saveWordsLocal();
      if($('#adminModal')) renderAdminList();
      return;
    }
    // val에서 아라를 철저히 제거
    let list = sanitizeWords(Object.values(val));
    if(!list.length) list = sanitizeWords(DEFAULT_WORDS);
    S.words = list;

    // 만약 DB 원본에 w20이나 아라가 남아있다면 DB에서도 즉시 삭제 및 정리
    if(val.w20 || Object.values(val).some(isAraWord)){
      try{ DB.remove('words/w20'); }catch(e){}
      Object.keys(val).forEach(k => {
        if(isAraWord(val[k])) try{ DB.remove('words/' + k); }catch(e){}
      });
      const cleanObj = {}; S.words.forEach(w => cleanObj[w.id] = w);
      DB.set('words', cleanObj);
    }

    if(localStorage.getItem('soonwoori_ver')!==WORDS_VERSION){
      mergeDefaults(S.words).forEach(w=>DB.set('words/'+w.id,w));
      localStorage.setItem('soonwoori_ver',WORDS_VERSION);
    }
    saveWordsLocal();
    if($('#adminModal')) renderAdminList();
  });
}

 * 방 상태 수신 & 렌더

function playersOf(room){
  return Object.entries(room.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>a.joined-b.joined);
}
function activePlayers(room){
  if(!room) return [];
  const ps = playersOf(room);
  if(room.hostIsSpectator){
    return ps.filter(p => p.id !== room.host);
  }
  return ps;
}
function orderOf(room){ return room.order ? Object.values(room.order) : []; }
const isHost = () => S.room && S.room.host===me.id;

function kickPlayer(playerId){
  if(!isHost() || !S.room) return;
  const p = S.room.players && S.room.players[playerId];
  const name = p ? p.name : '참가자';
  if(!confirm(`'${name}' 님을 대기실에서 내보낼까요?`)) return;
  if(P2P.isHosting){
    P2P.kick(playerId);
  } else {
    DB.set(`rooms/${S.pin}/players/${playerId}`, null);
  }
  toast(`'${name}' 님을 내보냈습니다`);
}

function resetToLobby(){

}

function onRoomUpdate(room){
  if(S.view!=='room') return;
  if(!room){
    if(P2P.room){
      room = P2P.room;
    } else {
      const fallback = S.pin && pathGet(readLocal(), 'rooms/' + S.pin);
      if(fallback){
        room = fallback;
      } else {
        return; // 일시적 지연일 수 있으므로 성급하게 방을 폭파하지 않음
      }
    }
  }

  // 방장 확인: 현재 사용자가 방장이면 절대 강퇴 처리하지 않고 참가자 목록에 본인을 항상 보장
  const isMeHost = (room.host === me.id) || (S.room && S.room.host === me.id) || (P2P.room && P2P.room.host === me.id);
  if(isMeHost){
    room.players = room.players || {};
    if(!room.players[me.id]){
      room.players[me.id] = playerObj(me.name);
    }
    S.hasJoinedRoom = true;
  } else {
    // 일반 학생 참가자인 경우:
    if(room.players && room.players[me.id]){
      S.hasJoinedRoom = true;
    } else if(S.hasJoinedRoom){
      // 기존에 정상적으로 방에 들어와 있다가 방장에 의해 목록에서 빠진 경우만 강퇴로 판정
      if(S.unsubRoom){ S.unsubRoom(); S.unsubRoom=null; }
      S.view='lobby'; S.room=null; S.hasJoinedRoom=false;
      toast('방장에 의해 대기실에서 내보내졌습니다');
      renderLobby();
      return;
    } else {
      // 아직 입장 처리(SYNC) 중인 상태이므로 대기
      return;
    }
  }

  const prevPhase=S.lastPhase;
  S.room=room;
  if(room.phase==='lobby' || room.phase==='role') S.myVote=null;
  S.myVote = (room.votes && room.votes[me.id]) || null;

  // 방장: 모든 투표 완료 시 자동 검사
  if(isHost() && room.phase==='vote'){
    const act = activePlayers(room);
    const v = Object.keys(room.votes||{}).length;
    if(act.length > 0 && v >= act.length){
      checkVoteCompletion(room);
    }
  }
  renderRoom(prevPhase!==room.phase);
}

function renderRoom(phaseChanged){
  const r=S.room;
  if(!r) return;

  // 투표 화면 깜빡임 방지: vote 페이즈에서 이미 렌더링된 상태라면 DOM 전체 재생성을 건너뛰고 내부 상태만 업데이트
  if(r.phase==='vote' && !phaseChanged && S.lastPhase==='vote' && document.getElementById('voteCardGrid')){
    updateVoteScreenInPlace();
    return;
  }

  const turnKey = r.phase==='speak' ? r.turnIdx : null;
  const needFull = phaseChanged || S.lastPhase===null || r.phase==='lobby' || r.phase==='role' || S.lastTurn!==turnKey || r.phase==='speak' || r.phase==='reveal' || r.phase==='liar_guess' || r.phase==='result';
  S.lastPhase=r.phase; S.lastTurn=turnKey;
  if(!needFull) return;
  const map={
    lobby:viewWaiting,
    role:viewRole,
    speak:viewSpeak,
    vote:viewVote,
    reveal:viewReveal,
    liar_guess:viewLiarGuess,
    result:viewResult
  };
  (map[r.phase]||viewWaiting)(phaseChanged);
  refreshIcons();
}

function avatarChip(p,extra=''){
  const r = S.room, host = isHost();

async function startGame(){
  const act = activePlayers(S.room);
  const pool = S.words.filter(w=>w && w.word && !isAraWord(w));
  if(!pool.length){ toast('등록된 고유어가 없어요. 선생님께 문의하세요'); return; }
  const w = pool[rnd(pool.length)];
  const liar = act[rnd(act.length)].id;
  const order = shuffle(act.map(p=>p.id));
  await DB.update('rooms/'+S.pin,{
    phase:'role',
    word:w,
    liar,
    order,
    turnIdx:0,
    turnEnd:null,
    votes:null,
    resultAt:null,
    round:(S.room.round||0)+1,
    accused:null,
    isRevote:false,
    revoteCandidates:null,
    revoteCount:0,
    liarGuess:null,
    liarWon:null,
    guessCorrect:null
  });
}

async function advanceTurn(expectedIdx){
  const r=S.room; if(!r||r.phase!=='speak'||r.turnIdx!==expectedIdx) return;
  if(!isHost() && P2P.activePin){

let lastSec=null;
function tickTimer(){
  const r=S.room; if(!r||r.phase!=='speak'||!r.turnEnd) return;
  const left=Math.max(0,r.turnEnd-Date.now()), sec=Math.ceil(left/1000);

  if(num){
    num.textContent=sec; bar.style.width=(left/(TURN_SECONDS*1000)*100)+'%';
    num.classList.toggle('text-rose-500',sec<=5); num.classList.toggle('text-violet-600',sec>5);
    if(sec<=5 && sec>0 && sec!==lastSec) sfx.tick();
    lastSec=sec;
  }
  if(left<=0 && isHost()) advanceTurn(r.turnIdx);
}
setInterval(tickTimer,250);

function handleVoteClick(targetId){
  if(S.myVote === targetId) return;

function updateVoteScreenInPlace(){
  const r=S.room; if(!r || r.phase!=='vote') return;
  const act = activePlayers(r);
  const votes = r.votes || {};
  const span = $('#voteCountSpan');
  if(span) span.textContent = `(${Object.keys(votes).length}/${act.length}명 투표 완료)`;

  document.querySelectorAll('[data-vote]').forEach(b=>{
    const tid = b.dataset.vote;
    const isSel = S.myVote === tid;
    b.classList.toggle('voted', isSel);
    const sub = b.querySelector('.vote-status-sub');
    if(sub){
      sub.textContent = isSel ? '✅ 내가 투표함' : (votes[tid] ? '투표 완료' : '고민 중...');
      sub.className = `text-xs font-bold mt-1 vote-status-sub ${isSel ? 'text-violet-600' : 'text-slate-400'}`;
    }
  });
}

async function checkVoteCompletion(r, force=false){
  if(!isHost() || !r || r.phase !== 'vote') return;
  const act = activePlayers(r);
  const votes = r.votes || {};
  const vCount = Object.keys(votes).length;
  if(!force && (act.length === 0 || vCount < act.length)) return;

  const count = {}; act.forEach(p => count[p.id] = 0);
  Object.values(votes).forEach(t => { if(count[t] !== undefined) count[t]++; });
  const max = Math.max(0, ...Object.values(count));
  const top = Object.keys(count).filter(id => count[id] === max && max > 0);

  // 동점자 발생 시 1회에 한해 결선 재투표 진행
  if(top.length > 1 && !r.isRevote && (!r.revoteCount || r.revoteCount < 1)){
    await DB.update('rooms/'+S.pin, {
      phase: 'vote',
      isRevote: true,
      revoteCandidates: top,
      revoteCount: (r.revoteCount || 0) + 1,
      votes: null
    });
    return;
  }

  // 최다 득표자 결정 후 극적인 공개(reveal) 단계로 이동
  const accusedId = top.length === 1 ? top[0] : null;
  await DB.update('rooms/'+S.pin, {
    phase: 'reveal',
    accused: accusedId,
    revealStartedAt: Date.now()
  });
}

async function submitLiarGuess(guessText){
  const r = S.room;
  if(!r) return;
  if(!isHost()){
    if(P2P.activePin) P2P.sendLiarGuess(guessText);
    return;
  }
  const cleanGuess = (guessText || '').trim().replace(/\s+/g, '');
  const cleanWord = (r.word && r.word.word || '').trim().replace(/\s+/g, '');
  const correct = cleanGuess.length > 0 && cleanGuess === cleanWord;

  await DB.update('rooms/'+S.pin, {
    phase: 'result',
    liarGuess: guessText || '(미입력)',
    liarWon: correct,
    guessCorrect: correct,
    resultAt: Date.now()
  });
}

function tally(r){
  const ps=playersOf(r), count={}; ps.forEach(p=>count[p.id]=0);
  Object.values(r.votes||{}).forEach(t=>{ if(count[t]!==undefined) count[t]++; });
  const max=Math.max(0,...Object.values(count));
  const top=Object.keys(count).filter(id=>count[id]===max && max>0);
  return {count,max,top};
}

            <button id="expWordsBtn" class="btn btn-ghost !py-1 !px-2.5 !min-h-0 text-xs flex items-center gap-1 font-bold">💾 단어 파일로 저장</button>
            <button id="impWordsBtn" class="btn btn-ghost !py-1 !px-2.5 !min-h-0 text-xs flex items-center gap-1 font-bold">📂 다른 PC로 가져오기</button>
            <input type="file" id="impWordsFile" accept=".json" class="hidden">
          </div>
        </div>
      </div>
    </div></div>`;

  $('#admClose').onclick=closeModal;

  // 단어 관리 이벤트
  $('#fAdd').onclick=addWord;
  $('#fReset').onclick=async()=>{
    if(!confirm('모든 고유어를 지우고 기본 고유어로 되돌릴까요?')) return;
    purgeAraStorage();
    S.words=sanitizeWords(DEFAULT_WORDS).slice(); saveWordsLocal();
    const obj={}; S.words.forEach(w=>obj[w.id]=w); await DB.set('words',obj);
    try{ await DB.remove('words/w20'); }catch(e){}
    renderAdminList(); toast('초기화했어요');
  };

  const printBtn = $('#printSheetBtn');
  if(printBtn) printBtn.onclick = () => openWorksheetModal('blank');

  const expBtn = $('#expWordsBtn');
  if(expBtn){
    expBtn.onclick=()=>{
      const blob = new Blob([JSON.stringify(S.words, null, 2)], { type: 'application/json;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `순우리말_단어목록.json`;
      a.click();
      toast('단어 목록 파일이 다운로드되었습니다 💾 (다른 컴퓨터에서 불러올 수 있어요)');
    };
  }
  const impBtn = $('#impWordsBtn');
  const impFile = $('#impWordsFile');
  if(impBtn && impFile){
    impBtn.onclick = () => impFile.click();
    impFile.onchange = e => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async ev => {
        try {
          const list = JSON.parse(ev.target.result);
          if(Array.isArray(list) && list.length){
            mergeDefaults(list);
            S.words = list;
            saveWordsLocal();
            if(DB.isFirebase){
              const obj={}; S.words.forEach(w=>obj[w.id]=w); await DB.set('words',obj);
            }
            renderAdminList();
            toast(`${list.length}개의 단어를 성공적으로 불러왔습니다! ✅`);
          } else {
            toast('올바른 단어 목록 파일 형식이 아니에요 😢');
          }
        } catch(err){
          toast('파일을 읽는 중 오류가 발생했습니다');
        }
        impFile.value = '';
      };
      reader.readAsText(file);
    };
  }

  renderAdminList();
  refreshIcons();
}

/* =====================================================================
 * 고유어 학습지 인쇄 모달 (학생용 빈칸 모드 / 교사용 정답 모드)
 * ===================================================================== */
function openWorksheetModal(mode = 'blank'){
  const cleanList = sanitizeWords(S.words);
  const rows = cleanList.map((w, idx) => {
    let wordCell = '';
    let exampleHtml = esc(w.example || '-');
    if(mode === 'blank'){
      wordCell = `<div class="h-8 flex items-center justify-center font-bold text-slate-300 border-b border-dashed border-slate-400 mx-1">( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</div>`;
      if(w.word && w.example){
        exampleHtml = esc(w.example).split(w.word).join('<span class="border-b border-slate-700 px-3 font-bold text-slate-400">( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</span>');
      }
    } else {
      wordCell = `<div class="font-extrabold text-rose-600 text-sm text-center">${esc(w.word)}</div>`;
      if(w.word && w.example){
        exampleHtml = esc(w.example).split(w.word).join(`<b class="text-rose-600 font-extrabold">[${esc(w.word)}]</b>`);
      }
    }
    return `
      <tr class="${idx%2===0?'bg-white':'bg-slate-50/60'}">
        <td class="py-2.5 px-1 border border-slate-400 text-center font-bold">${idx+1}</td>
        <td class="py-2.5 px-2 border border-slate-400">${wordCell}</td>
        <td class="py-2.5 px-2 border border-slate-400 text-center font-bold text-slate-600">${esc(w.hint)}</td>
        <td class="py-2.5 px-3 border border-slate-400 font-medium leading-snug">${esc(w.meaning)}</td>
        <td class="py-2.5 px-3 border border-slate-400 leading-snug font-medium">“${exampleHtml}”</td>
        <td class="py-2.5 px-2 border border-slate-400 text-center text-[11px] font-semibold text-slate-600">
          ${esc(w.hanja||'-')}<br><span class="text-slate-400">${esc(w.foreign||'-')}</span>
        </td>
      </tr>
    `;
  }).join('');

  $('#modalRoot').innerHTML = `
    <div id="worksheetModal" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/50 backdrop-blur-sm p-3 sm:p-6 flex flex-col items-center">
      <!-- 상단 컨트롤 바 (인쇄 시 자동 숨김) -->
      <div class="no-print w-full max-w-4xl bg-white/95 rounded-2xl p-3 shadow-xl mb-4 flex flex-wrap items-center justify-between gap-3 sticky top-2 z-10 border border-slate-200">
        <div class="flex items-center gap-2">
          <span class="text-lg">🖨️</span>
          <span class="font-extrabold text-slate-800 text-sm">고유어 학습지 인쇄 미리보기</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="bg-slate-100 p-1 rounded-xl flex items-center gap-1 border border-slate-200 text-xs font-bold">
            <button id="wsBlankBtn" class="px-3 py-1.5 rounded-lg transition ${mode==='blank'?'bg-emerald-600 text-white shadow':'text-slate-600 hover:text-slate-900'}">✏️ 학생용 (빈칸 퀴즈)</button>
            <button id="wsAnswerBtn" class="px-3 py-1.5 rounded-lg transition ${mode==='answer'?'bg-rose-600 text-white shadow':'text-slate-600 hover:text-slate-900'}">🔑 교사용 (정답·해설)</button>
          </div>
          <button id="wsDoPrint" class="btn btn-primary !py-1.5 !px-3.5 !min-h-0 text-xs font-extrabold flex items-center gap-1.5 shadow"><i data-lucide="printer" class="w-4 h-4"></i>바로 인쇄 (A4 / PDF)</button>
          <button id="wsBackToAdmin" class="btn btn-ghost !py-1.5 !px-3 !min-h-0 text-xs font-bold">대시보드로</button>
          <button id="wsClose" class="w-8 h-8 rounded-full glass flex items-center justify-center font-bold text-slate-600 hover:bg-slate-200">✕</button>
        </div>
      </div>

      <!-- 실제 A4 학습지 용지 영역 -->
      <div id="worksheetPaper" class="w-full max-w-4xl bg-white text-slate-900 p-8 sm:p-12 rounded-2xl shadow-2xl border border-slate-200 a-up font-sans">
        <!-- 학습지 타이틀 헤더 -->
        <div class="border-b-2 border-slate-800 pb-3 mb-4">
          <div class="flex items-center justify-between text-xs font-bold text-slate-500">
            <span class="border border-slate-400 px-2 py-0.5 rounded">초등학교 6학년 국어과</span>
            <span>단원: 6학년 국어 '소중한 우리말' (순우리말 마피아 연계)</span>
          </div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-center mt-3 tracking-tight text-slate-900">
            소중한 우리말(고유어) 탐구 학습지
            ${mode==='answer'?'<span class="text-rose-600 text-lg font-bold block sm:inline sm:ml-2">[교사용 정답·해설]</span>':'<span class="text-emerald-700 text-lg font-bold block sm:inline sm:ml-2">[학생용 빈칸 퀴즈]</span>'}
          </h1>
          <div class="flex flex-wrap items-center justify-between text-xs font-bold mt-4 pt-2 border-t border-slate-300 gap-2">
            <div>일시: 202&nbsp;&nbsp;년 &nbsp;&nbsp;월 &nbsp;&nbsp;일</div>
            <div class="flex items-center gap-4">
              <span>6학년 &nbsp;&nbsp;&nbsp;&nbsp;반 &nbsp;&nbsp;&nbsp;&nbsp;번</span>
              <span>이름: ____________________</span>
              <span class="border border-slate-400 px-2.5 py-0.5 rounded">점수: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;/ ${S.words.length}</span>
            </div>
          </div>
        </div>

        <!-- 안내 문구 -->
        <div class="text-xs font-semibold text-slate-700 mb-4 bg-slate-50 p-3 rounded-lg border border-slate-300">
          ${mode==='blank' 
            ? '💡 <b>[학습 안내]</b> 사전적 뜻풀이와 실생활 예문을 꼼꼼히 읽고, <b>( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</b> 빈칸에 들어갈 알맞은 아름다운 우리말(고유어)을 찾아 직접 써 봅시다.' 
            : '💡 <b>[교사용 지도 안내]</b> 빨간색 글씨는 정답 고유어입니다. 단어의 사전적 의미와 함께 대조되는 한자어·외래어와의 차이점을 함께 지도해 주세요.'}
        </div>

        <!-- 표 본문 -->
        <table class="print-table w-full text-xs border-collapse">
          <thead>
            <tr class="bg-slate-100 font-extrabold text-slate-800 text-center">
              <th class="py-2.5 px-1 border border-slate-400 w-10">번호</th>
              <th class="py-2.5 px-2 border border-slate-400 w-28">고유어 (순우리말)</th>
              <th class="py-2.5 px-2 border border-slate-400 w-20">힌트 범주</th>
              <th class="py-2.5 px-3 border border-slate-400 text-left">사전적 뜻풀이</th>
              <th class="py-2.5 px-3 border border-slate-400 text-left w-64">실생활 예문 (문맥 탐구)</th>
              <th class="py-2.5 px-2 border border-slate-400 w-28">대조 어휘<br><span class="text-[10px] text-slate-500 font-normal">(한자어 / 외래어)</span></th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>

        <!-- 하단 출처 및 저작권 안내 -->
        <div class="mt-6 pt-3 border-t border-slate-300 flex items-center justify-between text-[11px] text-slate-500 font-semibold">
          <span>순우리말 마피아 (고유어 라이어 게임) 수업 연계 자료</span>
          <span>출처: 하모쌤</span>
        </div>
      </div>
    </div>
  `;

  $('#wsBlankBtn').onclick = () => openWorksheetModal('blank');
  $('#wsAnswerBtn').onclick = () => openWorksheetModal('answer');
  $('#wsDoPrint').onclick = () => window.print();
  $('#wsBackToAdmin').onclick = openAdmin;
  $('#wsClose').onclick = closeModal;
  refreshIcons();
}
function renderAdminList(){
  const l=$('#wList'); if(!l) return;
  S.words = sanitizeWords(S.words);
  $('#wCount').textContent=`(${S.words.length}개)`;
  l.innerHTML=S.words.map(w=>`<div class="rounded-2xl bg-white/70 p-3 flex gap-3 items-start">
    <div class="flex-1 min-w-0">
      <div class="flex flex-wrap items-center gap-2"><span class="text-lg font-extrabold text-violet-600">${esc(w.word)}</span>
        <span class="text-xs font-bold bg-rose-100 text-rose-600 rounded-full px-2 py-0.5">힌트: ${esc(w.hint)}</span></div>
      <div class="text-sm font-bold mt-1">${esc(w.meaning)}</div>
      <div class="text-xs text-slate-500 mt-1">“${esc(w.example||'')}”</div>
      ${(w.hanja||w.foreign)?`<div class="text-xs text-slate-400 mt-1">한자어: ${esc(w.hanja||'-')} · 외래어: ${esc(w.foreign||'-')}</div>`:''}
    </div>
    <button data-del="${esc(w.id)}" class="w-9 h-9 shrink-0 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center" aria-label="삭제">🗑️</button>
  </div>`).join('') || '<div class="text-center text-slate-400 font-bold py-4">등록된 고유어가 없어요</div>';
  l.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('이 고유어를 삭제할까요?')) return;
    const id=b.dataset.del; S.words=S.words.filter(w=>w.id!==id); saveWordsLocal();
    await DB.remove('words/'+id);
    if(S.words.length===0){ /* 비어 있으면 리스너가 기본값을 다시 채우지 않도록 빈 표시 */ }
    renderAdminList();
  });
}
async function addWord(){
  const g=id=>$('#'+id).value.trim();
  const w={id:'w'+Date.now().toString(36),word:g('fWord'),meaning:g('fMeaning'),hint:g('fHint'),example:g('fExample'),hanja:g('fHanja'),foreign:g('fForeign')};
  if(!w.word||!w.meaning||!w.hint||!w.example){ toast('단어·뜻풀이·힌트·예문을 모두 입력해 주세요'); return; }
  if(isAraWord(w)){ toast('‘아라’는 가짜 순우리말이므로 등록할 수 없습니다'); return; }
  if(S.words.some(x=>x.word===w.word)){ toast('이미 등록된 단어예요'); return; }
  S.words.push(w); saveWordsLocal();
  try{ await DB.set('words/'+w.id,w); }catch(e){ toast('Firebase 저장 실패 (로컬에는 저장됨)'); }
  ['fWord','fMeaning','fHint','fExample','fHanja','fForeign'].forEach(id=>$('#'+id).value='');
  renderAdminList(); toast(`‘${w.word}’ 추가 완료! 바로 게임에 반영돼요 ✅`);
}

/* =====================================================================
 * 시작
 * ===================================================================== */
$('#adminBtn').onclick=openPwModal;
$('#topbar').style.display='none';
$('#modeBadge').textContent = DB.isFirebase ? '🟢 온라인(Firebase)' : '🟢 실시간 온라인';
initWordSync();
renderLobby();
refreshIcons();
</script>
