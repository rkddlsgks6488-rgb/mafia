  {id:'w15',word:'마루',meaning:'산이나 지붕 따위의 꼭대기를 이르는 말',hint:'산/높이',example:'산마루에 올라서자 마을이 한눈에 내려다보였다.',hanja:'정상(頂上)',foreign:'피크(peak)'},
  {id:'w16',word:'슬기',meaning:'사물의 이치를 빨리 깨닫고 일을 바르게 처리하는 능력',hint:'생각/능력',example:'우리 조상들은 슬기를 모아 어려움을 이겨냈다.',hanja:'지혜(智慧)',foreign:'위즈덤(wisdom)'},

  {id:'w18',word:'하늬바람',meaning:'서쪽에서 불어오는 바람',hint:'날씨/방향',example:'가을 들판에 하늬바람이 불어 벼가 출렁였다.',hanja:'서풍(西風)',foreign:'웨스트윈드(west wind)'},
  {id:'w19',word:'늘품',meaning:'앞으로 좋게 발전할 가능성이 있는 품질이나 소질',hint:'미래/가능성',example:'그 아이는 늘품이 있어 앞날이 기대된다.',hanja:'잠재력(潛在力)',foreign:'포텐셜(potential)'},
  {id:'w20',word:'아라',meaning:'바다의 옛 순우리말',hint:'물/자연',example:'아라 너머로 붉은 해가 떠오르고 있었다.',hanja:'해양(海洋)',foreign:'오션(ocean)'},
  {id:'w21',word:'아리땁다',meaning:'보기에 사랑스럽고 곱다',hint:'모습/느낌',example:'아리따운 꽃들이 화단에 가득 피었다.',hanja:'미려(美麗)',foreign:'뷰티풀(beautiful)'}
];
const WORDS_VERSION='2'; // 기본 단어가 늘어나면 올려서 기존 저장소에도 새 단어를 병합합니다
function mergeDefaults(list){
  const ids=new Set(list.map(w=>w.id)), added=[];
  DEFAULT_WORDS.forEach(w=>{ if(!ids.has(w.id)){ list.push(w); added.push(w); } });
  return added;
}

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const AVATARS = ['🐶','🐱','🐰','🦊','🐻','🐼','🐯','🐸','🦁','🐵','🐧','🦄'];
const COLORS = ['#ffd1dc','#d1e8ff','#d4f5d0','#fff3c4','#e6d4ff','#ffe0c2','#c8f2f2','#fdd6f0'];
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }
function toast(msg){
  const t=document.createElement('div');
  t.className='fixed left-1/2 -translate-x-1/2 bottom-8 glass rounded-2xl px-5 py-3 font-bold z-[100] a-up';
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400);
}
function pathGet(obj,path){ return path.split('/').filter(Boolean).reduce((o,k)=>(o==null?undefined:o[k]),obj); }
function pathSet(obj,path,val){
  const ks=path.split('/').filter(Boolean); let o=obj;
  for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; }
  if(val===null||val===undefined) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]]=val;
}

/* ---------- 효과음 ---------- */
let audioCtx;
function tone(freq,dur,type='sine',when=0,vol=.15){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination);
    const t=audioCtx.currentTime+when; o.start(t);
    g.gain.exponentialRampToValueAtTime(.001,t+dur); o.stop(t+dur);
  }catch(e){}
}
const sfx = {
  warn(){ for(let i=0;i<4;i++){ tone(880,.18,'square',i*.25,.12); tone(440,.18,'square',i*.25+.12,.12);} },
  ok(){ tone(660,.15,'sine',0); tone(880,.2,'sine',.15); },
  tick(){ tone(1000,.08,'triangle',0,.1); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,'sine',i*.13)); },
  lose(){ [400,330,260].forEach((f,i)=>tone(f,.3,'sawtooth',i*.16,.1)); },
  hover(){ tone(1200,.07,'sine',0,.05); },
  click(){ tone(700,.07,'triangle',0,.12); tone(1050,.12,'triangle',.06,.1); }
};

/* ---------- 배경음악 (WebAudio로 만든 잔잔한 루프, 켜기/끄기 가능) ---------- */
const BGM = {
  on: localStorage.getItem('sw_bgm')!=='off', gain:null, timer:null, next:0, step:0,
  melody:[523,659,784,659, 880,784,659,523, 587,659,784,880, 784,659,587,523,
          523,784,880,784, 659,587,523,587, 659,784,880,1047, 880,784,659,784],
  bass:[130.8,110,87.3,98],
  note(f,t,d,type,v){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=f; o.connect(g); g.connect(this.gain);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t); o.stop(t+d+.05);
  },
  sched(){
    while(this.next < audioCtx.currentTime+.4){
      const s=this.step%32, t=this.next;
      this.note(this.melody[s],t,.3,'sine',.5);
      if(s%4===0) this.note(this.bass[Math.floor(s/8)%4]*(s%8===4?2:1),t,.55,'triangle',.45);
      this.next+=.3; this.step++;
    }
  },
  start(){
    if(!this.on || this.timer) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      if(!this.gain){ this.gain=audioCtx.createGain(); this.gain.connect(audioCtx.destination); }
      this.gain.gain.cancelScheduledValues(audioCtx.currentTime); this.gain.gain.setValueAtTime(.12,audioCtx.currentTime);
      this.next=audioCtx.currentTime+.1; this.timer=setInterval(()=>this.sched(),120);
    }catch(e){}
  },
  stop(){
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.gain) this.gain.gain.setTargetAtTime(0,audioCtx.currentTime,.05);
  },
  toggle(){
    this.on=!this.on; localStorage.setItem('sw_bgm',this.on?'on':'off');
    this.on?this.start():this.stop(); this.paint();
  },
  paint(){ const b=document.getElementById('bgmBtn'); if(b){ b.textContent=this.on?'🎵':'🔇'; b.style.opacity=this.on?1:.7; } }
};

 * DB 어댑터 : Firebase 또는 로컬(localStorage) 모드
 * ===================================================================== */
const useFirebase = firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY' && window.firebase;
let fbDb = null;
if(useFirebase){
  try{ firebase.initializeApp(firebaseConfig); fbDb = firebase.database(); }
  catch(e){ console.error(e); }
}
const LOCAL_KEY='soonwoori_local_db';
const localListeners=[];
const readLocal=()=>{ try{return JSON.parse(localStorage.getItem(LOCAL_KEY))||{};}catch(e){return {};} };
function notifyLocal(){ const d=readLocal(); localListeners.forEach(l=>l.cb(pathGet(d,l.path)??null)); }
window.addEventListener('storage',e=>{ if(e.key===LOCAL_KEY) notifyLocal(); });

const DB = {
  isFirebase: !!fbDb,
  async get(path){
    if(fbDb){ const s=await fbDb.ref(path).once('value'); return s.val(); }
    return pathGet(readLocal(),path)??null;
  },
  async set(path,val){
    if(fbDb) return fbDb.ref(path).set(val);
    const d=readLocal(); pathSet(d,path,val); localStorage.setItem(LOCAL_KEY,JSON.stringify(d)); notifyLocal();
  },
  async update(path,obj){
    if(fbDb) return fbDb.ref(path).update(obj);
    const d=readLocal(); Object.keys(obj).forEach(k=>pathSet(d,path+'/'+k,obj[k]));
    localStorage.setItem(LOCAL_KEY,JSON.stringify(d)); notifyLocal();
  },
  async remove(path){ return this.set(path,null); },
  listen(path,cb){
    if(fbDb){ const r=fbDb.ref(path); const h=r.on('value',s=>cb(s.val())); return ()=>r.off('value',h); }
    const l={path,cb}; localListeners.push(l); setTimeout(()=>cb(pathGet(readLocal(),path)??null),0);
    return ()=>{ const i=localListeners.indexOf(l); if(i>=0) localListeners.splice(i,1); };
  }
};

async function createRoom(){

async function joinRoom(){
  const name=readNick(); if(!name) return;
  const pin=$('#pin').value.trim();

      if(Object.keys(players).length>=MAX_PLAYERS){ toast(`최대 ${MAX_PLAYERS}명까지 입장할 수 있어요`); return; }
      if(Object.values(players).some(p=>p.name===name)){ toast('같은 닉네임이 이미 있어요. 바꿔 주세요'); return; }
      await DB.set(`rooms/${pin}/players/${me.id}`,playerObj(name));

function enterRoom(pin){
  $('#topbar').style.display='flex';

  if(S.unsubRoom) S.unsubRoom();
  S.unsubRoom=DB.listen('rooms/'+pin,onRoomUpdate);
}
async function leaveRoom(){
  const pin=S.pin, room=S.room;
  if(S.unsubRoom){ S.unsubRoom(); S.unsubRoom=null; }
  S.view='lobby'; S.pin=null; S.room=null;
  try{
    if(room && room.host===me.id) await DB.remove('rooms/'+pin);

  }catch(e){}

/* =====================================================================
 * 방 상태 수신 & 렌더
 * ===================================================================== */
function playersOf(room){
  return Object.entries(room.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>a.joined-b.joined);
}
function orderOf(room){ return room.order ? Object.values(room.order) : []; }
const isHost = () => S.room && S.room.host===me.id;

function onRoomUpdate(room){
  if(S.view!=='room') return;
  if(!room){
    if(S.unsubRoom){S.unsubRoom();S.unsubRoom=null;}
    S.view='lobby'; S.room=null; toast('방이 사라졌어요. 로비로 이동합니다'); renderLobby(); return;
  }
  if(!room.players || !room.players[me.id]){
    // 내가 목록에서 빠졌다면 로비로
    if(S.unsubRoom){S.unsubRoom();S.unsubRoom=null;}
    S.view='lobby'; S.room=null; renderLobby(); return;
  }
  const prevPhase=S.lastPhase;
  S.room=room;
  if(room.phase==='lobby' || room.phase==='role') S.myVote=null;
  S.myVote = (room.votes && room.votes[me.id]) || null;

  // 방장: 모든 투표 완료 시 자동 결과 공개
  if(isHost() && room.phase==='vote'){
    const n=Object.keys(room.players).length, v=Object.keys(room.votes||{}).length;
    if(v>=n) DB.update('rooms/'+S.pin,{phase:'result',resultAt:Date.now()});
  }
  renderRoom(prevPhase!==room.phase);
}

function renderRoom(phaseChanged){
  const r=S.room;
  const turnKey = r.phase==='speak' ? r.turnIdx : null;
  const needFull = phaseChanged || S.lastPhase===null || r.phase==='lobby' || r.phase==='vote' || r.phase==='role' || S.lastTurn!==turnKey || r.phase==='speak';
  S.lastPhase=r.phase; S.lastTurn=turnKey;
  if(!needFull) return;
  const map={lobby:viewWaiting,role:viewRole,speak:viewSpeak,vote:viewVote,result:viewResult};
  (map[r.phase]||viewWaiting)(phaseChanged);
  refreshIcons();
}

async function advanceTurn(expectedIdx){
  const r=S.room; if(!r||r.phase!=='speak'||r.turnIdx!==expectedIdx) return;
  const total=orderOf(r).length;
  if(expectedIdx+1<total) await DB.update('rooms/'+S.pin,{turnIdx:expectedIdx+1,turnEnd:Date.now()+TURN_SECONDS*1000});
  else await DB.update('rooms/'+S.pin,{phase:'vote',votes:null,turnEnd:null});
}
let lastSec=null;
function tickTimer(){
  const r=S.room; if(!r||r.phase!=='speak'||!r.turnEnd) return;
  const left=Math.max(0,r.turnEnd-Date.now()), sec=Math.ceil(left/1000);
  const num=$('#timerNum'), bar=$('#timerBar');
  if(num){
    num.textContent=sec; bar.style.width=(left/(TURN_SECONDS*1000)*100)+'%';
    num.classList.toggle('text-rose-500',sec<=5); num.classList.toggle('text-violet-600',sec>5);
    if(sec<=5 && sec>0 && sec!==lastSec) sfx.tick();
    lastSec=sec;
  }
  if(left<=0 && isHost()) advanceTurn(r.turnIdx);
}
setInterval(tickTimer,250);

/* ---------- 화면 4: 투표 ---------- */
function viewVote(){
  const r=S.room, ps=playersOf(r), votes=r.votes||{}, host=isHost();
  $('#screen').innerHTML=`<div class="a-up">${roomHeader('🗳️ 누가 라이어일까요?')}
    <div class="glass rounded-2xl p-3 mb-4 text-center font-bold">가장 의심스러운 친구를 터치하세요! <span class="text-violet-600">(${Object.keys(votes).length}/${ps.length}명 투표 완료)</span></div>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
      ${ps.map(p=>{const self=p.id===me.id, sel=S.myVote===p.id;
        return `<button data-vote="${p.id}" ${self?'disabled':''} class="glass rounded-2xl p-4 flex flex-col items-center transition ${sel?'voted':''} ${self?'opacity-50':'active:scale-95'}">
          <div class="w-16 h-16 rounded-full flex items-center justify-center text-4xl shadow-inner" style="background:${p.color}">${p.avatar}</div>
          <div class="mt-2 font-extrabold break-all">${esc(p.name)}${self?' (나)':''}</div>
          <div class="text-xs font-bold mt-1 ${sel?'text-violet-600':'text-slate-400'}">${sel?'✅ 내가 투표함':(votes[p.id]?'투표 완료':'고민 중...')}</div>
        </button>`}).join('')}
    </div>
    ${host?`<button id="closeVote" class="btn btn-red w-full mt-5 flex items-center justify-center gap-2"><i data-lucide="gavel" class="w-5 h-5"></i>투표 마감하고 결과 보기</button>`:''}
  </div>`;
  bindLeave();
  document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{
    DB.set(`rooms/${S.pin}/votes/${me.id}`,b.dataset.vote); sfx.ok();
  });
  const c=$('#closeVote'); if(c) c.onclick=()=>DB.update('rooms/'+S.pin,{phase:'result',resultAt:Date.now()});
}

/* ---------- 화면 5: 결과 ---------- */
function tally(r){
  const ps=playersOf(r), count={}; ps.forEach(p=>count[p.id]=0);
  Object.values(r.votes||{}).forEach(t=>{ if(count[t]!==undefined) count[t]++; });
  const max=Math.max(0,...Object.values(count));
  const top=Object.keys(count).filter(id=>count[id]===max && max>0);
  return {count,max,top};
}
function viewResult(changed){
  const r=S.room, ps=playersOf(r), byId=Object.fromEntries(ps.map(p=>[p.id,p]));
  const {count,max,top}=tally(r);
  const liar=byId[r.liar]||{name:'(퇴장)',avatar:'❓',color:'#eee'};
  const caught = top.length===1 && top[0]===r.liar;
  const accused = top.length===1 ? byId[top[0]] : null;
  const w=r.word;
  $('#screen').innerHTML=`<div>${roomHeader('')}
    <div class="glass rounded-2xl p-5 text-center a-up">
      <div class="font-extrabold text-slate-500">🗳️ 투표 결과</div>
      <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 mt-3">
        ${ps.map(p=>`<div class="rounded-xl p-2 ${p.id===top[0]&&top.length===1?'bg-amber-100/80 ring-2 ring-amber-400':'bg-white/50'}">
          <div class="text-2xl">${p.avatar}</div><div class="text-xs font-extrabold break-all">${esc(p.name)}</div>
          <div class="font-extrabold text-violet-600">${count[p.id]}표</div></div>`).join('')}
      </div>
      <div class="mt-4 font-bold hidden-until a-up" style="animation-delay:1s">
        ${accused?`최다 득표자: <b class="text-amber-600">${esc(accused.name)}</b> (${max}표)`:'동점이라 지목된 사람이 없어요!'}
      </div>
    </div>

    <div class="glass-red rounded-2xl p-6 mt-4 text-center hidden-until a-pop" style="animation-delay:2s">
      <div class="text-6xl a-float">👑</div>
      <div class="inline-block bg-rose-600 text-white font-extrabold px-4 py-1 rounded-full text-sm shadow my-2">🚨 진짜 라이어</div>
      <div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-5xl shadow-inner" style="background:${liar.color}">${liar.avatar}</div>
      <div class="text-3xl font-extrabold text-rose-700 mt-2">${esc(liar.name)}${r.liar===me.id?' (나)':''}</div>
      <div class="mt-3 text-xl font-extrabold ${caught?'text-emerald-700':'text-rose-900'}">${caught?'🎉 시민 승리! 라이어를 찾아냈어요!':'😈 라이어 승리! 끝까지 정체를 숨겼어요!'}</div>
    </div>

    <div id="learnWrap" class="hidden-until a-up mt-4" style="animation-delay:3.2s">
      <div id="learnCard" class="glass rounded-2xl p-6 sm:p-8" style="background:rgba(255,255,255,.8)">
        <div class="text-center">
          <div class="inline-block text-xs font-extrabold px-3 py-1 rounded-full bg-violet-500 text-white">📚 오늘의 고유어 학습 카드</div>
          <div class="text-5xl sm:text-6xl font-extrabold mt-3 bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-violet-500">${esc(w.word)}</div>
        </div>
        <div class="mt-5 rounded-2xl bg-sky-50/90 p-4"><div class="text-xs font-extrabold text-sky-600 mb-1">📖 사전적 뜻</div><div class="font-extrabold text-lg leading-snug">${esc(w.meaning)}</div></div>
        <div class="mt-3 rounded-2xl bg-emerald-50/90 p-4">
          <div class="text-xs font-extrabold text-emerald-600 mb-2">🔍 한자어 · 외래어 대조표</div>
          <table class="w-full text-center text-sm font-bold">
            <thead><tr class="text-slate-500"><th class="pb-1">고유어</th><th class="pb-1">한자어</th><th class="pb-1">외래어</th></tr></thead>
            <tbody><tr><td class="text-violet-600 font-extrabold">${esc(w.word)}</td><td>${esc(w.hanja||'-')}</td><td>${esc(w.foreign||'-')}</td></tr></tbody>
          </table>
        </div>
        <div class="mt-3 rounded-2xl bg-amber-50/90 p-4"><div class="text-xs font-extrabold text-amber-600 mb-1">✏️ 실생활 예문</div><div class="font-bold leading-relaxed">“${esc(w.example||'')}”</div></div>
        <div class="mt-3 text-center text-xs font-bold text-slate-400">💡 힌트 범주: ${esc(w.hint)} · 순우리말 마피아 · 출처: 하모쌤</div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-${isHost()?3:2} gap-3 mt-4">
        <button id="saveBtn" class="btn btn-primary flex items-center justify-center gap-2"><i data-lucide="download" class="w-5 h-5"></i>화면 캡처/저장하기</button>
        ${isHost()?`<button id="againBtn" class="btn btn-green flex items-center justify-center gap-2"><i data-lucide="rotate-ccw" class="w-5 h-5"></i>같은 방에서 다시 하기</button>`:''}
        <button id="homeBtn" class="btn btn-ghost flex items-center justify-center gap-2"><i data-lucide="home" class="w-5 h-5"></i>로비로 돌아가기</button>
      </div>
    </div>
  </div>`;
  bindLeave();
  $('#homeBtn').onclick=leaveRoom;
  const a=$('#againBtn'); if(a) a.onclick=()=>DB.update('rooms/'+S.pin,{phase:'lobby',votes:null,word:null,liar:null,order:null,turnEnd:null});
  $('#saveBtn').onclick=saveCard;
  if(changed){
    setTimeout(()=>{ caught?sfx.win():sfx.lose(); },2000);
    setTimeout(()=>{
      if(caught){
        confetti({particleCount:140,spread:90,origin:{y:.5}});
        setTimeout(()=>confetti({particleCount:100,angle:60,spread:70,origin:{x:0,y:.7}}),300);
        setTimeout(()=>confetti({particleCount:100,angle:120,spread:70,origin:{x:1,y:.7}}),300);
      }
    },2000);
  }
}
async function saveCard(){
  const el=$('#learnCard');
  if(!window.html2canvas){ toast('캡처 도구를 불러오지 못했어요. 스크린샷을 이용해 주세요 📸'); return; }
  try{
    const canvas=await html2canvas(el,{backgroundColor:'#f3f0ff',scale:2});
    const a=document.createElement('a');
    a.download=`고유어카드_${S.room.word.word}.png`; a.href=canvas.toDataURL('image/png'); a.click();
    toast('학습 카드를 저장했어요 ✅');
  }catch(e){ toast('저장 실패: 스크린샷을 이용해 주세요 📸'); }
}

/* =====================================================================
 * 교사용 관리자 (비밀번호 모달 + 고유어 대시보드)
 * ===================================================================== */
function closeModal(){ $('#modalRoot').innerHTML=''; }
function openPwModal(){
  $('#modalRoot').innerHTML=`<div id="pwModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/30 backdrop-blur-sm">
    <div class="glass rounded-2xl p-6 w-full max-w-sm a-pop" style="background:rgba(255,255,255,.8)">
      <div class="text-center text-4xl mb-1">🔐</div>
      <h3 class="text-xl font-extrabold text-center mb-3">선생님 확인</h3>
      <input id="pwInp" type="password" inputmode="numeric" class="inp text-center text-xl tracking-widest" placeholder="비밀번호">
      <div id="pwErr" class="text-rose-500 text-sm font-bold text-center mt-2 h-5"></div>
      <div class="grid grid-cols-2 gap-2 mt-2">
        <button id="pwCancel" class="btn btn-ghost">취소</button><button id="pwOk" class="btn btn-primary">확인</button>
      </div>
    </div></div>`;
  const inp=$('#pwInp'); inp.focus();
  const submit=()=>{
    if(inp.value===ADMIN_PASSWORD){ openAdmin(); }
    else{ $('#pwErr').textContent='비밀번호가 올바르지 않아요'; inp.value=''; inp.parentElement.classList.remove('a-shake'); void inp.offsetWidth; inp.parentElement.classList.add('a-shake'); }
  };
  $('#pwOk').onclick=submit; $('#pwCancel').onclick=closeModal;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
}
function openAdmin(){
  $('#modalRoot').innerHTML=`<div id="adminModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 bg-slate-900/30 backdrop-blur-sm">
    <div class="glass rounded-2xl w-full max-w-2xl max-h-[92vh] flex flex-col a-up" style="background:rgba(255,255,255,.85)">
      <div class="flex items-center justify-between p-4 border-b border-white/70">
        <h3 class="text-xl font-extrabold">📋 고유어 관리 대시보드</h3>
        <button id="admClose" class="w-10 h-10 rounded-full glass flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="overflow-y-auto p-4 space-y-4">
        <div class="rounded-2xl bg-white/60 p-4 space-y-2">
          <div class="font-extrabold">➕ 새 고유어 추가</div>
          <input id="fWord" class="inp" placeholder="고유어(단어) 예) 마루">
          <input id="fMeaning" class="inp" placeholder="뜻풀이">
          <input id="fHint" class="inp" placeholder="라이어 힌트(상위 개념) 예) 집/공간">
          <input id="fExample" class="inp" placeholder="교과서 실생활 예문">
          <div class="grid grid-cols-2 gap-2">
            <input id="fHanja" class="inp" placeholder="(선택) 대응 한자어">
            <input id="fForeign" class="inp" placeholder="(선택) 대응 외래어">
          </div>
          <button id="fAdd" class="btn btn-green w-full">추가하기</button>
        </div>
        <div><div class="font-extrabold mb-2">현재 등록된 고유어 <span id="wCount" class="text-violet-600"></span></div><div id="wList" class="space-y-2"></div></div>
        <button id="fReset" class="text-xs text-slate-500 underline">기본 고유어로 초기화</button>
      </div>
    </div></div>`;
  $('#admClose').onclick=closeModal;
  $('#fAdd').onclick=addWord;
  $('#fReset').onclick=async()=>{
    if(!confirm('모든 고유어를 지우고 기본 고유어로 되돌릴까요?')) return;
    S.words=DEFAULT_WORDS.slice(); saveWordsLocal();
    const obj={}; S.words.forEach(w=>obj[w.id]=w); await DB.set('words',obj); renderAdminList(); toast('초기화했어요');
  };
  renderAdminList(); refreshIcons();
}
function renderAdminList(){
  const l=$('#wList'); if(!l) return;
  $('#wCount').textContent=`(${S.words.length}개)`;
  l.innerHTML=S.words.map(w=>`<div class="rounded-2xl bg-white/70 p-3 flex gap-3 items-start">
    <div class="flex-1 min-w-0">
      <div class="flex flex-wrap items-center gap-2"><span class="text-lg font-extrabold text-violet-600">${esc(w.word)}</span>
        <span class="text-xs font-bold bg-rose-100 text-rose-600 rounded-full px-2 py-0.5">힌트: ${esc(w.hint)}</span></div>
      <div class="text-sm font-bold mt-1">${esc(w.meaning)}</div>
      <div class="text-xs text-slate-500 mt-1">“${esc(w.example||'')}”</div>
      ${(w.hanja||w.foreign)?`<div class="text-xs text-slate-400 mt-1">한자어: ${esc(w.hanja||'-')} · 외래어: ${esc(w.foreign||'-')}</div>`:''}
    </div>
    <button data-del="${esc(w.id)}" class="w-9 h-9 shrink-0 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center" aria-label="삭제">🗑️</button>
  </div>`).join('') || '<div class="text-center text-slate-400 font-bold py-4">등록된 고유어가 없어요</div>';
  l.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('이 고유어를 삭제할까요?')) return;
    const id=b.dataset.del; S.words=S.words.filter(w=>w.id!==id); saveWordsLocal();
    await DB.remove('words/'+id);
    if(S.words.length===0){ /* 비어 있으면 리스너가 기본값을 다시 채우지 않도록 빈 표시 */ }
    renderAdminList();
  });
}
async function addWord(){
  const g=id=>$('#'+id).value.trim();
  const w={id:'w'+Date.now().toString(36),word:g('fWord'),meaning:g('fMeaning'),hint:g('fHint'),example:g('fExample'),hanja:g('fHanja'),foreign:g('fForeign')};
  if(!w.word||!w.meaning||!w.hint||!w.example){ toast('단어·뜻풀이·힌트·예문을 모두 입력해 주세요'); return; }
  if(S.words.some(x=>x.word===w.word)){ toast('이미 등록된 단어예요'); return; }
  S.words.push(w); saveWordsLocal();
  try{ await DB.set('words/'+w.id,w); }catch(e){ toast('Firebase 저장 실패 (로컬에는 저장됨)'); }
  ['fWord','fMeaning','fHint','fExample','fHanja','fForeign'].forEach(id=>$('#'+id).value='');
  renderAdminList(); toast(`‘${w.word}’ 추가 완료! 바로 게임에 반영돼요 ✅`);
}

/* =====================================================================
 * 시작
 * ===================================================================== */
$('#adminBtn').onclick=openPwModal;
$('#topbar').style.display='none';
$('#modeBadge').textContent = DB.isFirebase ? '🟢 온라인(Firebase)' : '🟡 로컬 체험 모드';
initWordSync();
renderLobby();
refreshIcons();
</script>
